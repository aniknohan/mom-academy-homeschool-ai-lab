name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk MomAcademy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MomAcademy-apk
          path: MomAcademy.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" MomAcademy.apk \
            --title "Mom Academy ${TAG}" \
            --notes "Download **MomAcademy.apk** below, open it on your Android phone and tap Install. Installing a newer version keeps your progress." \
            --latest
