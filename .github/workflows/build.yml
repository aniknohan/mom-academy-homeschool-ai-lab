name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk MomAcademy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MomAcademy.apk

  windows:
    name: Build Windows app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build the app
        run: |
          cp -r web windows/web
          cd windows
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H windowsgui -s -w" -o "Mom Academy.exe" .
          mkdir -p "../dist/Mom Academy"
          cp "Mom Academy.exe" "How to install.txt" "../dist/Mom Academy/"
          cd ../dist && zip -qr ../MomAcademy-Windows.zip "Mom Academy"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: MomAcademy-Windows.zip

  release:
    name: Publish release
    needs: [apk, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/MomAcademy.apk out/MomAcademy-Windows.zip \
            --title "Mom Academy ${TAG}" \
            --notes "**Android:** download **MomAcademy.apk**, open it and tap Install. **Windows:** download **MomAcademy-Windows.zip**, extract it and run **Mom Academy.exe**. Installing a newer version keeps your progress." \
            --latest
